# Deploys the Vite app to GitHub Pages at https://<user>.github.io/<repo>/
# Repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Vite inlines import.meta.env.VITE_* at build time (same values as your local .env for prod APIs).
      # Add repo secrets: Settings → Secrets and variables → Actions → New repository secret
      #   VITE_SPOTIFY_STATUS_URL, VITE_INSTAGRAM_AVATAR_URL (absolute https URLs, not /api/… alone).
      - name: Verify and build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_SPOTIFY_STATUS_URL: ${{ secrets.VITE_SPOTIFY_STATUS_URL }}
          VITE_INSTAGRAM_AVATAR_URL: ${{ secrets.VITE_INSTAGRAM_AVATAR_URL }}
        run: npm run verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
